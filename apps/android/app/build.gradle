// StormFlix Android 0.6.4 - native catalog + Web Player + Playback Anywhere native routing
plugins {
    id 'com.android.application'
}

android {
    namespace 'cloud.stormflix.app'
    compileSdk 36

    defaultConfig {
        applicationId 'cloud.stormflix.app'
        minSdk 23
        targetSdk 36
        versionCode 22
        versionName '0.6.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Playback Anywhere uses the current Google Cast Application Framework on
    // Android so discovery/session management is native instead of relying on
    // the Web Sender SDK inside Android System WebView.
    implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'

    // Video playback itself remains the StormFlix Web Playback Engine. Keep
    // ExoPlayer because the native MusicActivity still uses Media3 for audio.
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
}
