// StormFlix Android 0.6.5 - native catalog + Web Player + Google Cast + DLNA/UPnP
plugins {
    id 'com.android.application'
}

android {
    namespace 'cloud.stormflix.app'
    compileSdk 36

    defaultConfig {
        applicationId 'cloud.stormflix.app'
        minSdk 23
        targetSdk 36
        versionCode 23
        versionName '0.6.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google Cast is native; DLNA/UPnP is implemented directly with Android/
    // Java network APIs and does not require a casting application dependency.
    implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'

    // Video playback itself remains the StormFlix Web Playback Engine. Keep
    // ExoPlayer because the native MusicActivity still uses Media3 for audio.
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
}
