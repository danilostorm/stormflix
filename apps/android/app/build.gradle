// StormFlix Android 0.6.1 - native catalog UI + unified Web Video Player
plugins {
    id 'com.android.application'
}

android {
    namespace 'cloud.stormflix.app'
    compileSdk 36

    defaultConfig {
        applicationId 'cloud.stormflix.app'
        minSdk 23
        targetSdk 36
        versionCode 19
        versionName '0.6.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Video playback no longer uses Media3. It is provided by Android System
    // WebView + the StormFlix Web Playback Engine on phone/tablet/TV/Fire TV.
    // Keep ExoPlayer only because the native MusicActivity still uses it for
    // audio playback and listening progress.
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
}
