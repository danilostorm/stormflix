// StormFlix Android 0.8.2 - original playback, local audio decoding, Cast/DLNA
plugins {
    id 'com.android.application'
}

android {
    namespace 'cloud.stormflix.app'
    compileSdk 36

    defaultConfig {
        applicationId 'cloud.stormflix.app'
        minSdk 23
        targetSdk 36
        versionCode 28
        versionName '0.8.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google Cast is native; DLNA/UPnP is implemented directly with Android/
    // Java network APIs and does not require a casting application dependency.
    implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Decode original video on the device; the extension adds local audio codecs.
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation project(':decoder-ffmpeg')
    implementation 'androidx.media3:media3-ui:1.11.0'
}
