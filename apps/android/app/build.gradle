// StormFlix Android 0.6.1 - native catalog UI + unified Web Playback Engine
plugins {
    id 'com.android.application'
}

android {
    namespace 'cloud.stormflix.app'
    compileSdk 36

    defaultConfig {
        applicationId 'cloud.stormflix.app'
        minSdk 23
        targetSdk 36
        versionCode 19
        versionName '0.6.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Playback is provided by Android System WebView + the StormFlix Web Playback
// Engine. Removing Media3 avoids shipping and maintaining a second player stack.
dependencies {
}
