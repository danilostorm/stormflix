// StormFlix Android 0.7.0 - native Media3 playback + Web fallback + Cast/DLNA
plugins {
    id 'com.android.application'
}

android {
    namespace 'cloud.stormflix.app'
    compileSdk 36

    defaultConfig {
        applicationId 'cloud.stormflix.app'
        minSdk 23
        targetSdk 36
        versionCode 25
        versionName '0.7.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google Cast is native; DLNA/UPnP is implemented directly with Android/
    // Java network APIs and does not require a casting application dependency.
    implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'

    // Video uses Media3 natively for Direct Play/remux/HLS/transcode plans; the
    // existing Web Playback Engine remains a guarded fallback.
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.0'
    implementation 'androidx.media3:media3-ui:1.11.0'
}
