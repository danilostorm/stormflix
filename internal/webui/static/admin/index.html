<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StormFlix Admin</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/admin/phase2.css">
  <link rel="stylesheet" href="/admin/admin-monitoring.css">
  <link rel="stylesheet" href="/admin/admin-v3.css">
  <link rel="stylesheet" href="/admin/admin-v4.css">
  <link rel="stylesheet" href="/admin/admin-v5.css">
  <link rel="stylesheet" href="/admin/admin-v6.css">
  <link rel="stylesheet" href="/admin/admin-catalog.css">
  <link rel="stylesheet" href="/admin/admin-library-groups.css">
  <link rel="stylesheet" href="/admin/admin-music-progress.css">
</head>
<body>
<div id="gate" class="gate">
  <form id="gate-form" class="gate-card">
    <div class="brand">STORM<span>FLIX</span></div>
    <p class="kicker" id="gate-kicker">Administração</p>
    <h1 id="gate-title">Entrar</h1>
    <input id="gate-display" placeholder="Nome de exibição" class="setup-only hidden">
    <input id="gate-user" placeholder="Usuário" required autocomplete="username">
    <input id="gate-pass" type="password" placeholder="Senha" required autocomplete="current-password">
    <button id="gate-submit">Entrar</button>
    <p id="gate-message" class="msg"></p>
  </form>
</div>
<div id="app" class="app hidden">
  <aside>
    <div class="brand">STORM<span>FLIX</span></div>
    <div class="sub">ADMIN · DIRECT PLAY ONLY</div>
    <nav>
      <span class="nav-group">Visão geral</span>
      <button data-page="dashboard" class="active">Dashboard</button>

      <span class="nav-group">Conteúdo</span>
      <button data-page="libraries">Bibliotecas</button>
      <button data-page="catalog">Catálogo</button>
      <button data-page="categories">Categorias</button>
      <button data-page="metadata">Metadados & Capas</button>
      <button data-page="subtitles">Legendas</button>
      <button data-page="cdn">CDN / Assets</button>

      <span class="nav-group">Pessoas</span>
      <button data-page="users" data-admin>Contas & Perfis</button>
      <button data-page="sessions" data-admin>Sessões</button>
      <button data-page="playbacks">Reproduzindo agora</button>

      <span class="nav-group">Sistema</span>
      <button data-page="storage">Armazenamento</button>
      <button data-page="cleanup" data-admin>Limpeza</button>
      <button data-page="logs">Logs</button>
      <button data-page="server">Servidor</button>
      <button data-page="settings" data-admin>Configurações</button>
    </nav>
    <div class="aside-bottom"><a href="/">← StormFlix</a><button id="logout" class="ghost">Sair</button></div>
  </aside>
  <main>
    <header><div><p class="kicker">Painel administrativo</p><h1 id="page-title">Dashboard</h1></div><div id="who" class="who"></div></header>
    <div id="notice" class="notice"></div>
    <section id="dashboard" class="page"></section>
    <section id="users" class="page hidden"></section>
    <section id="libraries" class="page hidden"></section>
    <section id="catalog" class="page hidden"></section>
    <section id="categories" class="page hidden"></section>
    <section id="metadata" class="page hidden"></section>
    <section id="subtitles" class="page hidden"></section>
    <section id="cdn" class="page hidden"></section>
    <section id="sessions" class="page hidden"></section>
    <section id="playbacks" class="page hidden"></section>
    <section id="storage" class="page hidden"></section>
    <section id="cleanup" class="page hidden"></section>
    <section id="logs" class="page hidden"></section>
    <section id="server" class="page hidden"></section>
    <section id="settings" class="page hidden"></section>
  </main>
</div>
<script src="/admin/admin.js" defer></script>
<script src="/admin/admin-browser.js" defer></script>
<script src="/admin/admin-scanner.js" defer></script>
<script src="/admin/admin-phase2.js" defer></script>
<script src="/admin/admin-settings.js" defer></script>
<script src="/admin/admin-diagnostics.js" defer></script>
<script src="/admin/admin-enhancements.js" defer></script>
<script src="/admin/admin-monitoring.js" defer></script>
<script src="/admin/admin-v3.js" defer></script>
<script src="/admin/admin-v4.js" defer></script>
<script src="/admin/admin-catalog.js" defer></script>
<script src="/admin/admin-music.js" defer></script>
<script src="/admin/admin-library-metadata.js" defer></script>
</body>
</html>
