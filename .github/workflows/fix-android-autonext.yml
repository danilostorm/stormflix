name: Fix Android autoplay literals

on:
  push:
    branches: [android-0.4.1-autoplay-streaming]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-0.4.1-autoplay-streaming
      - name: Fix Java string literals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('apps/android/app/src/main/java/cloud/stormflix/app/PlayerActivity.java')
          text=path.read_text()
          old='+'+'"'+chr(92)+'\n'+'Reprodução automática em '
          new='+'+'"'+chr(92)+'n'+'Reprodução automática em '
          if old in text:
              text=text.replace(old,new)
          path.write_text(text)
          PY
          if git diff --quiet; then
            echo 'No literal fix required.'
            exit 0
          fi
          git config user.name 'stormflix-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -f apps/android/app/src/main/java/cloud/stormflix/app/PlayerActivity.java
          git commit -m 'fix: keep Android autoplay countdown string valid'
          git push origin HEAD:android-0.4.1-autoplay-streaming
