name: Jellyfin Live Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/jellyfin-live-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DNS and IP family
        shell: bash
        run: |
          set +e
          echo '--- A ---'
          dig +short A stormflix.cloud
          echo '--- AAAA ---'
          dig +short AAAA stormflix.cloud
          echo '--- IPv4 ---'
          curl -4 -sS -D - --max-time 10 https://stormflix.cloud/System/Info/Public -o /tmp/info4.json
          cat /tmp/info4.json 2>/dev/null || true
          echo
          echo '--- IPv6 ---'
          curl -6 -sS -D - --max-time 10 https://stormflix.cloud/System/Info/Public -o /tmp/info6.json
          rc=$?
          cat /tmp/info6.json 2>/dev/null || true
          echo
          echo "curl_ipv6_rc=$rc"
          exit 0

      - name: TLS certificate chain
        shell: bash
        run: |
          set -euo pipefail
          openssl s_client -connect stormflix.cloud:443 -servername stormflix.cloud -showcerts </dev/null > /tmp/chain.txt 2>/tmp/tls.err || true
          python3 - <<'PY'
          import re, subprocess
          text=open('/tmp/chain.txt', errors='replace').read()
          certs=re.findall(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', text, re.S)
          print('presented_certificates=', len(certs))
          for i, cert in enumerate(certs):
              path=f'/tmp/cert-{i}.pem'
              open(path,'w').write(cert+'\n')
              out=subprocess.check_output(['openssl','x509','-in',path,'-noout','-subject','-issuer'], text=True)
              print(f'certificate[{i}]')
              print(out.strip())
          PY
          echo '--- verify path ---'
          grep -E '^(depth=|Verify return code:)' /tmp/tls.err /tmp/chain.txt || true

      - name: HTTPS public system info
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D /tmp/info.headers --max-time 10 https://stormflix.cloud/System/Info/Public -o /tmp/info.json
          cat /tmp/info.headers
          cat /tmp/info.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/info.json'))
          print('parsed=', p)
          assert p.get('ProductName') == 'Jellyfin Server', p
          assert p.get('Version'), p
          assert p.get('Id'), p
          assert p.get('StartupWizardCompleted') is True, p
          PY

      - name: HTTP redirect behavior
        shell: bash
        run: |
          set +e
          curl -sS -D - --max-time 10 -o /dev/null http://stormflix.cloud/System/Info/Public
          exit 0

      - name: Ping
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D - --max-time 10 https://stormflix.cloud/System/Ping

      - name: Authentication endpoint contract
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -D /tmp/auth.headers --max-time 10 -o /tmp/auth.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'X-Emby-Authorization: MediaBrowser Client="Jellyfin Android TV", Device="GitHub Probe", DeviceId="stormflix-probe", Version="0.19.10"' \
            --data '{"Username":"__stormflix_probe_invalid__","Pw":"__invalid__"}' \
            https://stormflix.cloud/Users/AuthenticateByName)
          cat /tmp/auth.headers
          cat /tmp/auth.json
          echo "HTTP=$code"
          test "$code" = "401"
