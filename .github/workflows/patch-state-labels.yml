name: Patch state labels

on:
  push:
    branches: [android-0.4.1-autoplay-streaming]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-0.4.1-autoplay-streaming
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('PROJECT_STATE.md')
          s=p.read_text()
          s=s.replace('Dynamic HLS session cache (Web)', 'Dynamic HLS session cache (Web/Android/TV/Fire)')
          s=s.replace('Seekable compatibility MP4 cache (native/manual fallback)', 'Seekable compatibility MP4 cache (legacy/manual fallback)')
          s=s.replace('`internal/webcompat/materialize.go` + `CacheManager` remain for Android/TV/manual compatibility paths.', '`internal/webcompat/materialize.go` + `CacheManager` remain for legacy/unknown native and manual compatibility paths.')
          p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name stormflix-ci
          git config user.email actions@users.noreply.github.com
          git add PROJECT_STATE.md
          git commit -m 'docs: align dynamic HLS client scope'
          git push origin HEAD:android-0.4.1-autoplay-streaming
