name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Format checkout
        run: gofmt -w ./cmd ./internal

      - name: JavaScript syntax
        run: |
          node scripts/build-web-bundles.mjs --check
          node --check internal/webui/static/feature-loader.js
          node --check internal/webui/static/admin/admin.js
          node --check internal/webui/static/admin/admin-browser.js
          node --check internal/webui/static/admin/admin-scanner.js
          node --check internal/webui/static/admin/admin-phase2.js
          node --check internal/webui/static/admin/admin-settings.js
          node --check internal/webui/static/admin/admin-trakt.js
          node --check internal/webui/static/admin/admin-diagnostics.js
          node --check internal/webui/static/admin/admin-enhancements.js
          node --check internal/webui/static/admin/admin-monitoring.js
          node --check internal/webui/static/admin/admin-v3.js
          node --check internal/webui/static/admin/admin-v4.js
          node --check internal/webui/static/admin/admin-catalog.js
          node --check internal/webui/static/admin/admin-categories.js
          node --check internal/webui/static/admin/admin-automation.js
          node --check internal/webui/static/admin/admin-transcode.js
          node --check internal/webui/static/admin/admin-music.js
          node --check internal/webui/static/admin/admin-games.js
          node --check internal/webui/static/admin/admin-games-hub.js
          node --check internal/webui/static/admin/admin-games-metadata.js
          node --check internal/webui/static/admin/admin-library-metadata.js
          node --check internal/webui/static/admin/admin-jobs.js
          node --check internal/webui/static/admin/admin-time.js
          node --check internal/webui/static/admin/admin-smooth-operations.js
          node --check internal/webui/static/admin/admin-performance.js
          node --check internal/webui/static/app.js
          node --check internal/webui/static/device-capabilities.js
          node --check internal/webui/static/main.stormflix.bundle.js
          node --check internal/webui/static/catalog-performance.js
          node --check internal/webui/static/series-ui.js
          node --check internal/webui/static/series-rules.js
          node --check internal/webui/static/profiles.js
          node --check internal/webui/static/mobile-shell.js
          node --check internal/webui/static/profile-hub.js
          node --check internal/webui/static/ratings-ui.js
          node --check internal/webui/static/category-nav.js
          node --check internal/webui/static/collections-nav.js
          node --check internal/webui/static/music-ui.js
          node --check internal/webui/static/games-instant-cache.js
          node --check internal/webui/static/games-ui.js
          node --check internal/webui/static/games-player.js
          node --check internal/webui/static/games-g4-session.js
          node --check internal/webui/static/games-g4.js
          node --check internal/webui/static/games-g4-video.js
          node --check internal/webui/static/games-g4-polish.js
          node --check internal/webui/static/games-g43-ui.js
          node --check internal/webui/static/games-g45-home-compat.js
          node --check internal/webui/static/games-g48-home.js
          node --check internal/webui/static/games-g49-collections.js
          node --check internal/webui/static/ux-v2.js
          node --check internal/webui/static/ux-v3.js
          node --check internal/webui/static/source-selector.js
          node --check internal/webui/static/person-ui.js
          node --check internal/webui/static/webcompat.js
          node --check internal/webui/static/playback-core.js
          node --check internal/webui/static/playback-core-v53.js
          node --check internal/webui/static/local-origin-player.js
          node --check internal/webui/static/player-v3.js
          node --check internal/webui/static/player-v4.js
          node --check internal/webui/static/player-v5.js
          node --check internal/webui/static/playback-anywhere.js
          node --check internal/webui/static/player-audio-v53.js
          node --check internal/webui/static/player-screen-v54.js
          node --check internal/webui/static/player-captions.js
          node --check internal/webui/static/player-simple.js
          node --check internal/webui/static/games-android.js
          node --check internal/webui/static/player-monitor.js
          node --check internal/webui/static/autoplay-next.js
          node --check internal/webui/static/continue-watching.js
          node --check internal/webui/static/rail-nav-v2.js

      - name: Test
        run: go test ./...

      - name: Device capability runtime tests
        run: |
          node scripts/test-device-capabilities.mjs
          node scripts/test-original-playback.mjs
          python3 -m unittest discover -s scripts -p 'test_measure_home_slo.py'

      - name: Race playback and streaming engines
        run: go test -race ./internal/playback ./internal/webcompat ./internal/transcode ./internal/streaming

      - name: Build
        run: go build -trimpath ./cmd/stormflix

  embedded-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and fixture encoder
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Decode original MP4 and MKV inside the browser
        run: |
          node scripts/test-embedded-browser.mjs
          node scripts/test-player-controls.mjs
          node scripts/test-catalog-paging.mjs
          node scripts/test-game-input.mjs
