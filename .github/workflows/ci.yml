name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          if [ -n "$files" ]; then
            echo "Files requiring gofmt:"
            echo "$files"
            exit 1
          fi

      - name: JavaScript syntax
        run: |
          node --check internal/webui/static/admin/admin.js
          node --check internal/webui/static/admin/admin-browser.js
          node --check internal/webui/static/admin/admin-phase2.js
          node --check internal/webui/static/app.js

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath ./cmd/stormflix
