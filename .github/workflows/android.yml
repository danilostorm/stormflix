name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Read Android version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" apps/android/app/build.gradle | head -n1)
          if [ -z "$VERSION" ]; then
            echo 'Could not read Android versionName' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=android-v$VERSION" >> "$GITHUB_OUTPUT"

      # Keep the APK reproducible from the repository without Android Studio.
      - name: Build installable APK
        run: gradle -p apps/android :app:assembleDebug --no-daemon

      - name: Prepare release files
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "StormFlix-Android-v${VERSION}.apk"
          sha256sum "StormFlix-Android-v${VERSION}.apk" > "StormFlix-Android-v${VERSION}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormFlix-Android-${{ steps.version.outputs.version }}
          path: |
            StormFlix-Android-v${{ steps.version.outputs.version }}.apk
            StormFlix-Android-v${{ steps.version.outputs.version }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            "StormFlix-Android-v${VERSION}.apk" \
            "StormFlix-Android-v${VERSION}.sha256" \
            --target "$GITHUB_SHA" \
            --title "StormFlix Android ${VERSION}" \
            --generate-notes \
            --notes "APK instalável para Android, Android TV e Fire TV. Este canal automatiza os builds de teste do StormFlix diretamente do main; uma chave de assinatura de produção dedicada deve ser configurada antes de distribuição em loja."
