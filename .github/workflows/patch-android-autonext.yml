name: Patch Android autoplay source

on:
  push:
    branches: [android-0.4.1-autoplay-streaming]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-0.4.1-autoplay-streaming
      - name: Apply focused source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('apps/android/app/src/main/java/cloud/stormflix/app/PlayerActivity.java')
          text=path.read_text()
          if 'AUTO_NEXT_SECONDS = 10' not in text:
              def rep(old,new,count=1):
                  global text
                  if old not in text:
                      raise SystemExit('expected PlayerActivity source fragment not found: '+old[:120])
                  text=text.replace(old,new,count)

              rep('    private static final long SEEK_REPEAT_MIN_MS = 110L;\n', '    private static final long SEEK_REPEAT_MIN_MS = 110L;\n    private static final int AUTO_NEXT_SECONDS = 10;\n    private static final String PLAYER_PREFS = "stormflix_player";\n    private static final String PREF_AUTO_NEXT = "auto_next_episode";\n')
              rep('    private String nextEpisodeTitle = "Próximo episódio";\n', '''    private String nextEpisodeTitle = "Próximo episódio";\n    private AlertDialog autoNextDialog;\n    private int autoNextRemaining;\n\n    private final Runnable autoNextTick = new Runnable() {\n        @Override public void run() {\n            if (autoNextDialog == null || !autoNextDialog.isShowing() || nextEpisodeId <= 0) return;\n            autoNextRemaining--;\n            if (autoNextRemaining <= 0) {\n                long id = nextEpisodeId;\n                String episodeTitle = nextEpisodeTitle;\n                cancelAutoNextCountdown();\n                launchEpisode(id, episodeTitle);\n                return;\n            }\n            updateAutoNextMessage();\n            main.postDelayed(this, 1000);\n        }\n    };\n''')
              text=text.replace('StormFlix-Android/0.3.0','StormFlix-Android/" + BuildConfig.VERSION_NAME')
              text=text.replace('headers.put("User-Agent", "StormFlix-Android/" + BuildConfig.VERSION_NAME");', 'headers.put("User-Agent", "StormFlix-Android/" + BuildConfig.VERSION_NAME);')
              text=text.replace('.setUserAgent("StormFlix-Android/" + BuildConfig.VERSION_NAME")', '.setUserAgent("StormFlix-Android/" + BuildConfig.VERSION_NAME)')
              rep('if (nextEpisodeId > 0) main.postDelayed(PlayerActivity.this::offerNextEpisode, 350);','if (nextEpisodeId > 0) main.postDelayed(PlayerActivity.this::handleEpisodeEnded, 350);')
              rep('items.add("Reiniciar do início");if(previousEpisodeId>0)items.add("Episódio anterior");if(nextEpisodeId>0)items.add("Próximo episódio");items.add("Informações");', 'items.add("Reiniciar do início");items.add("Próximo episódio automático: "+(autoNextEnabled()?"Ligado":"Desligado"));if(previousEpisodeId>0)items.add("Episódio anterior");if(nextEpisodeId>0)items.add("Próximo episódio");items.add("Informações");')
              rep('else if(item.equals("Reiniciar do início")){reportEvent("SEEK_REQUESTED","target=0 restart");player.seekTo(0);}else if(item.equals("Episódio anterior"))launchEpisode(previousEpisodeId,previousEpisodeTitle);', 'else if(item.equals("Reiniciar do início")){reportEvent("SEEK_REQUESTED","target=0 restart");player.seekTo(0);}else if(item.startsWith("Próximo episódio automático:"))toggleAutoNext();else if(item.equals("Episódio anterior"))launchEpisode(previousEpisodeId,previousEpisodeTitle);')
              rep('    private void offerNextEpisode(){if(nextEpisodeId<=0||isFinishing())return;new AlertDialog.Builder(this).setTitle("Próximo episódio").setMessage(nextEpisodeTitle).setPositiveButton("Reproduzir",(d,w)->launchEpisode(nextEpisodeId,nextEpisodeTitle)).setNegativeButton("Fechar",null).show();}\n    private void launchEpisode(long id,String episodeTitle){if(id<=0)return;clearSeekFeedback();if(!finishingSent){finishingSent=true;queueProgress("episode_change",true);}Intent intent=new Intent(this,PlayerActivity.class);intent.putExtra("media_id",id);intent.putExtra("title",episodeTitle);startActivity(intent);finish();}\n', '''    private boolean autoNextEnabled(){return getSharedPreferences(PLAYER_PREFS,MODE_PRIVATE).getBoolean(PREF_AUTO_NEXT,true);}\n    private void setAutoNextEnabled(boolean enabled){getSharedPreferences(PLAYER_PREFS,MODE_PRIVATE).edit().putBoolean(PREF_AUTO_NEXT,enabled).apply();}\n    private void toggleAutoNext(){boolean enabled=!autoNextEnabled();setAutoNextEnabled(enabled);Toast.makeText(this,"Próximo episódio automático "+(enabled?"ligado":"desligado"),Toast.LENGTH_SHORT).show();}\n    private void handleEpisodeEnded(){if(nextEpisodeId<=0||isFinishing())return;if(autoNextEnabled())startAutoNextCountdown();else offerNextEpisode();}\n    private void startAutoNextCountdown(){\n        if(nextEpisodeId<=0||isFinishing())return;\n        cancelAutoNextCountdown();\n        autoNextRemaining=AUTO_NEXT_SECONDS;\n        autoNextDialog=new AlertDialog.Builder(this)\n            .setTitle("A seguir")\n            .setMessage(nextEpisodeTitle+"\\nReprodução automática em "+autoNextRemaining+"s.")\n            .setPositiveButton("Reproduzir agora",(d,w)->launchEpisode(nextEpisodeId,nextEpisodeTitle))\n            .setNegativeButton("Cancelar",(d,w)->cancelAutoNextCountdown())\n            .setNeutralButton("Desativar automático",(d,w)->{setAutoNextEnabled(false);cancelAutoNextCountdown();})\n            .create();\n        autoNextDialog.setOnDismissListener(d->main.removeCallbacks(autoNextTick));\n        autoNextDialog.show();\n        main.postDelayed(autoNextTick,1000);\n    }\n    private void updateAutoNextMessage(){if(autoNextDialog!=null&&autoNextDialog.isShowing())autoNextDialog.setMessage(nextEpisodeTitle+"\\nReprodução automática em "+autoNextRemaining+"s.");}\n    private void cancelAutoNextCountdown(){main.removeCallbacks(autoNextTick);AlertDialog dialog=autoNextDialog;autoNextDialog=null;if(dialog!=null&&dialog.isShowing())dialog.dismiss();}\n    private void offerNextEpisode(){if(nextEpisodeId<=0||isFinishing())return;cancelAutoNextCountdown();new AlertDialog.Builder(this).setTitle("Próximo episódio").setMessage(nextEpisodeTitle).setPositiveButton("Reproduzir",(d,w)->launchEpisode(nextEpisodeId,nextEpisodeTitle)).setNegativeButton("Fechar",null).show();}\n    private void launchEpisode(long id,String episodeTitle){if(id<=0)return;cancelAutoNextCountdown();clearSeekFeedback();if(!finishingSent){finishingSent=true;queueProgress("episode_change",true);}Intent intent=new Intent(this,PlayerActivity.class);intent.putExtra("media_id",id);intent.putExtra("title",episodeTitle);startActivity(intent);finish();}\n''')
              rep('main.removeCallbacks(hideControls);clearSeekFeedback();','main.removeCallbacks(hideControls);cancelAutoNextCountdown();clearSeekFeedback();')
              path.write_text(text)

          caps=Path('apps/android/app/src/main/java/cloud/stormflix/app/PlaybackCapabilities.java')
          c=caps.read_text()
          c=c.replace('private static final String VERSION = "0.3.0";', 'private static final String VERSION = BuildConfig.VERSION_NAME;')
          caps.write_text(c)
          PY

          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'stormflix-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -f apps/android/app/src/main/java/cloud/stormflix/app/PlayerActivity.java apps/android/app/src/main/java/cloud/stormflix/app/PlaybackCapabilities.java
          git commit -m 'feat: autoplay next episode on Android and TV'
          git push origin HEAD:android-0.4.1-autoplay-streaming
